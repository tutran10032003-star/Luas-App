<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myLUAS - Live Luas Tram Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-200">

    <!-- HEADER -->
    <header class="bg-red-600 text-white shadow-md">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <h1 class="font-bold text-2xl tracking-tight">myLUAS 🚊</h1>
                <p class="text-xs text-red-100 font-medium">Dublin Live Tram Arrivals</p>
            </div>
            <button onclick="findNearestStop()" id="btn-nearest" class="bg-white/10 hover:bg-white/25 text-white text-xs font-semibold px-3 py-2 rounded-xl transition border border-white/20 flex items-center gap-1">
                📍 Nearest Stop
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-xl mx-auto px-4 py-6 flex-grow w-full space-y-4">
        
        <!-- STOP SELECTION CARD -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <label for="stop-select" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Your Stop</label>
            <div class="flex gap-2">
                <select id="stop-select" onchange="onStopChange()" class="flex-grow px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-semibold bg-slate-50">
                    <option value="" disabled>Loading stops...</option>
                </select>
            </div>
        </div>

        <!-- ERROR OR STATUS MESSAGE CONTAINER -->
        <div id="error-container" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-semibold"></div>

        <!-- SERVICE MESSAGE -->
        <div id="service-message-box" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-2">
            <span>⚠️</span> <span id="service-message-text">Normal service operating.</span>
        </div>

        <!-- LIVE FORECAST BOARD -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="bg-slate-900 text-white px-5 py-3.5 flex items-center justify-between">
                <div>
                    <h2 id="board-stop-name" class="font-bold text-base">Select a stop</h2>
                    <p id="last-updated" class="text-[11px] text-slate-400">Last updated: Never</p>
                </div>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    ● Live
                </span>
            </div>

            <!-- DIRECTIONS CONTAINER -->
            <div id="directions-container" class="p-5 space-y-5">
                <div class="text-center text-slate-400 py-8 text-sm font-medium">
                    Please choose a stop above to view live arrivals.
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs text-slate-400 font-medium border-t border-slate-100 bg-white">
        Data: Transport Infrastructure Ireland. Built by [Tên của bạn] for BDAIB.
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const BASE_URL = 'https://luas-class.kluxy.app';
        let allStopsData = [];
        let refreshTimer = null;

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadStopsList();
        });

        // 1. Fetch Stops and Populate Grouped Dropdown
        async function loadStopsList() {
            const selectElement = document.getElementById('stop-select');
            try {
                const response = await fetch(`${BASE_URL}/stops`);
                if (!response.ok) throw new Error('Failed to fetch stops list from relay.');
                const data = await response.json();
                
                allStopsData = data.stops || data; // handle array or object wrapper

                // Group stops by line
                const redStops = allStopsData.filter(s => (s.line || '').toLowerCase() === 'red');
                const greenStops = allStopsData.filter(s => (s.line || '').toLowerCase() === 'green');

                let html = '';
                if (redStops.length > 0) {
                    html += `<optgroup label="Red Line">`;
                    redStops.forEach(s => {
                        html += `<option value="${s.id}">${s.name}</option>`;
                    });
                    html += `</optgroup>`;
                }
                if (greenStops.length > 0) {
                    html += `<optgroup label="Green Line">`;
                    greenStops.forEach(s => {
                        html += `<option value="${s.id}">${s.name}</option>`;
                    });
                    html += `</optgroup>`;
                }
                selectElement.innerHTML = html;

                // Restore choice from localStorage or default to MYS
                const savedStop = localStorage.getItem('myLuas_selectedStop');
                const defaultStop = allStopsData.some(s => s.id === savedStop) ? savedStop : 'MYS';
                selectElement.value = defaultStop;

                // Load initial forecast
                fetchForecast(defaultStop);

                // Setup auto-refresh every 20 seconds
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(() => {
                    const currentStop = selectElement.value;
                    if (currentStop) fetchForecast(currentStop, true);
                }, 20000);

            } catch (error) {
                showError(`Error loading stops: ${error.message}`);
            }
        }

        // When user changes dropdown selection
        function onStopChange() {
            const stopId = document.getElementById('stop-select').value;
            localStorage.setItem('myLuas_selectedStop', stopId);
            fetchForecast(stopId);
        }

        // 2. Fetch Live Forecast for a stop
        async function fetchForecast(stopId, isBackground = false) {
            hideError();
            if (!isBackground) {
                document.getElementById('directions-container').innerHTML = `
                    <div class="text-center text-slate-400 py-8 text-sm animate-pulse">Loading live trams...</div>
                `;
            }

            try {
                const response = await fetch(`${BASE_URL}/forecast?stop=${stopId}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                renderForecast(data);
                
                // Update timestamp
                const now = new Date().toLocaleTimeString();
                document.getElementById('last-updated').innerText = `Last updated: ${now}`;

            } catch (error) {
                showError(`Failed to fetch live forecast: ${error.message}`);
                if (!isBackground) {
                    document.getElementById('directions-container').innerHTML = `
                        <div class="text-center text-red-500 py-6 text-xs font-semibold">Could not retrieve live arrivals.</div>
                    `;
                }
            }
        }

        // Render Forecast Board
        function renderForecast(data) {
            document.getElementById('board-stop-name').innerText = data.stopName || 'Tram Board';

            // Handle service message
            const msgBox = document.getElementById('service-message-box');
            const msgText = document.getElementById('service-message-text');
            if (data.message && data.message.trim() !== '' && data.message.toLowerCase() !== 'normal service operating') {
                msgText.innerText = data.message;
                msgBox.classList.remove('hidden');
            } else {
                msgBox.classList.add('hidden');
            }

            const container = document.getElementById('directions-container');
            let html = '';

            if (!data.directions || data.directions.length === 0) {
                html = `<div class="text-center text-slate-400 py-6 text-xs">No directions available right now.</div>`;
            } else {
                data.directions.forEach(dir => {
                    html += `
                        <div>
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                                <span>🧭</span> ${dir.name}
                            </h3>
                    `;

                    // Slice to show max 3 trams as requested
                    const trams = (dir.trams || []).slice(0, 3);

                    if (trams.length === 0) {
                        html += `<p class="text-xs text-slate-400 italic bg-slate-50 p-3 rounded-xl">No upcoming trams.</p>`;
                    } else {
                        html += `<div class="space-y-2">`;
                        trams.forEach(tram => {
                            const isDueNow = tram.due === 0 || tram.due === '0' || String(tram.due).toLowerCase() === 'due';
                            html += `
                                <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-xl flex items-center justify-between">
                                    <div class="flex items-center gap-2.5">
                                        <span class="text-lg">🚊</span>
                                        <span class="font-bold text-sm text-slate-800">${tram.destination}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-3 py-1 rounded-lg text-xs font-bold ${isDueNow ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-200 text-slate-700'}">
                                            ${isDueNow ? 'Due' : tram.due + ' min'}
                                        </span>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
            }
            container.innerHTML = html;
        }

        // Error Handlers
        function showError(message) {
            const errBox = document.getElementById('error-container');
            errBox.innerText = message;
            errBox.classList.remove('hidden');
        }

        function hideError() {
            const errBox = document.getElementById('error-container');
            errBox.classList.add('hidden');
        }

        // Stretch A: Nearest Stop via Geolocation & Haversine Formula
        function findNearestStop() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }
            const btn = document.getElementById('btn-nearest');
            btn.innerText = 'Locating...';

            navigator.geolocation.getCurrentPosition(position => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                btn.innerText = '📍 Nearest Stop';

                if (allStopsData.length === 0) {
                    alert('Stops data not loaded yet.');
                    return;
                }

                let closestStop = null;
                let minDistance = Infinity;

                allStopsData.forEach(stop => {
                    if (stop.lat && stop.lng) {
                        const dist = haversineDistance(userLat, userLon, parseFloat(stop.lat), parseFloat(stop.lng));
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestStop = stop;
                        }
                    }
                });

                if (closestStop) {
                    document.getElementById('stop-select').value = closestStop.id;
                    onStopChange();
                    alert(`Nearest stop found: ${closestStop.name} (~${(minDistance * 1000).toFixed(0)}m away)`);
                } else {
                    alert('Could not determine nearest stop.');
                }
            }, () => {
                btn.innerText = '📍 Nearest Stop';
                alert('Unable to retrieve your location.');
            });
        }

        // Haversine formula helper
        function haversineDistance(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            const R = 6371; // km
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
    </script>
</body>
</html>
