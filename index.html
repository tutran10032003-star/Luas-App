<!-- JAVASCRIPT LOGIC -->
    <script>
        const BASE_URL = 'https://luas-class.kluxy.app';

        // Switch Tabs
        function switchTab(tab) {
            const forecastSec = document.getElementById('section-forecast');
            const networkSec = document.getElementById('section-network');
            const tabForecast = document.getElementById('tab-forecast');
            const tabNetwork = document.getElementById('tab-network');
            const mascotSpeech = document.getElementById('mascot-speech');

            if (tab === 'forecast') {
                forecastSec.classList.remove('hidden');
                networkSec.classList.add('hidden');
                tabForecast.className = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 bg-emerald-500 text-white shadow-sm";
                tabNetwork.className = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 text-emerald-700 hover:bg-emerald-100/60";
                mascotSpeech.innerText = "✨ You are on the Live Forecast tab! Enter a stop code (e.g., MYS) and I'll check incoming trams for you!";
            } else {
                forecastSec.classList.add('hidden');
                networkSec.classList.remove('hidden');
                tabNetwork.className = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 bg-emerald-500 text-white shadow-sm";
                tabForecast.className = "px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 text-emerald-700 hover:bg-emerald-100/60";
                mascotSpeech.innerText = "🗺️ Welcome to the Network Map! I am fetching all stations for you.";
                fetchAllStopsAndFilter('red');
            }
        }

        function quickSelect(stopCode) {
            switchTab('forecast');
            document.getElementById('stop-input').value = stopCode;
            fetchForecast();
        }

        // Cute Mascot Loading Animation
        function showLoading(containerId, message) {
            document.getElementById(containerId).innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-emerald-100 text-center flex flex-col items-center justify-center space-y-3">
                    <div class="text-4xl mascot-float">🏃‍♂️💨</div>
                    <p class="text-xs font-bold text-emerald-800">${message}</p>
                </div>
            `;
        }

        // Fetch Forecast API
        async function fetchForecast() {
            const stopCode = document.getElementById('stop-input').value.trim().toUpperCase();
            const resultDiv = document.getElementById('forecast-result');
            const mascotSpeech = document.getElementById('mascot-speech');

            if (!stopCode) {
                alert('Please enter a valid stop code!');
                return;
            }

            showLoading('forecast-result', `Mascot is sprinting to fetch data for stop [${stopCode}]...`);
            mascotSpeech.innerText = `🔍 I'm rushing to stop ${stopCode} to check the tram schedule, please wait!`;

            try {
                const response = await fetch(`${BASE_URL}/forecast?stop=${stopCode}`);
                if (!response.ok) throw new Error('Failed to connect to the relay server.');
                const data = await response.json();

                renderForecast(data);
                mascotSpeech.innerText = `🎉 All done! Updated schedule for ${data.stopName || data.stop || stopCode} is ready!`;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-50 p-6 rounded-3xl border border-red-200 text-center text-red-600 text-xs font-semibold">
                        ❌ Oops! Could not load data for stop "${stopCode}". Please check the stop code or try again later!
                    </div>
                `;
                mascotSpeech.innerText = `⚠️ Oh no, there was a connection hiccup. Try entering another stop code!`;
            }
        }

        // Render Forecast Data
        function renderForecast(data) {
            const resultDiv = document.getElementById('forecast-result');
            
            let html = `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-emerald-100 mb-3 flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-emerald-900 text-base">${data.stopName || data.stop || 'Luas Stop'}</h3>
                        <p class="text-xs text-emerald-600 font-medium">Updated: ${data.created || 'Just now'}</p>
                    </div>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">Live Data 🟢</span>
                </div>
            `;

            if (!data.directions || data.directions.length === 0) {
                html += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-emerald-100 text-center text-slate-500 text-xs font-medium">
                        💤 No upcoming trams or the station is currently closed.
                    </div>
                `;
            } else {
                data.directions.forEach(dir => {
                    html += `
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-emerald-100 mb-3">
                            <h4 class="font-bold text-sm text-emerald-800 mb-3 flex items-center gap-1.5">
                                <span>🧭</span> Inbound/Outbound: ${dir.name}
                            </h4>
                    `;

                    if (!dir.trams || dir.trams.length === 0) {
                        html += `<p class="text-xs text-slate-400 italic">No upcoming trams available for this direction.</p>`;
                    } else {
                        html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">`;
                        dir.trams.forEach(tram => {
                            const isDUE = tram.dueMins === 'Due' || tram.dueMins === '0';
                            html += `
                                <div class="bg-emerald-50/60 border border-emerald-100 p-3 rounded-2xl flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xl">🚋</span>
                                        <div>
                                            <p class="text-xs font-bold text-emerald-900">${tram.destination}</p>
                                            <p class="text-[11px] text-emerald-600 font-medium">Line: ${tram.line || 'Luas'}</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${isDUE ? 'bg-amber-400 text-white shadow-sm' : 'bg-emerald-200/80 text-emerald-900'}">
                                            ${isDUE ? 'Due now!' : tram.dueMins + ' mins'}
                                        </span>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
            }

            resultDiv.innerHTML = html;
        }

        // Fetch All Stops via /stops and filter by line (Red/Green)
        async function fetchAllStopsAndFilter(line) {
            const resultDiv = document.getElementById('network-result');
            const btnRed = document.getElementById('btn-red');
            const btnGreen = document.getElementById('btn-green');

            if (line === 'red') {
                btnRed.className = "flex-1 py-2.5 rounded-2xl text-sm font-bold border border-red-200 bg-red-50 text-red-700 transition shadow-sm";
                btnGreen.className = "flex-1 py-2.5 rounded-2xl text-sm font-bold border border-emerald-200 bg-white text-emerald-700 transition shadow-sm";
            } else {
                btnGreen.className = "flex-1 py-2.5 rounded-2xl text-sm font-bold border border-emerald-200 bg-emerald-50 text-emerald-800 transition shadow-sm";
                btnRed.className = "flex-1 py-2.5 rounded-2xl text-sm font-bold border border-red-200 bg-white text-red-700 transition shadow-sm";
            }

            showLoading('network-result', `Mascot is fetching and filtering stations for the ${line.toUpperCase()} Line...`);

            try {
                const response = await fetch(`${BASE_URL}/stops`);
                if (!response.ok) throw new Error('Failed to load stops data.');
                const allStops = await response.json();

                // Lọc trạm dựa theo thuộc tính line hoặc tên tuyến
                const filteredStops = allStops.filter(stop => {
                    const stopLine = (stop.line || '').toLowerCase();
                    return stopLine.includes(line);
                });

                renderNetwork(filteredStops.length > 0 ? filteredStops : allStops, line);
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-50 p-6 rounded-3xl border border-red-200 text-center text-red-600 text-xs font-semibold">
                        ❌ Could not load stations. Please check your connection!
                    </div>
                `;
            }
        }

        // Render Network Stops
        function renderNetwork(stops, line) {
            const resultDiv = document.getElementById('network-result');
            let html = `
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-emerald-100 mb-3 flex items-center justify-between">
                    <span class="text-xs font-bold text-emerald-900">${line.toUpperCase()} Line Stations</span>
                    <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full">${stops.length || 0} stops</span>
                </div>
                <div class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
            `;

            if (!stops || stops.length === 0) {
                html += `<div class="bg-white p-6 rounded-3xl text-center text-slate-400 text-xs">No stops found.</div>`;
            } else {
                stops.forEach(stop => {
                    html += `
                        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between hover:border-emerald-300 transition">
                            <div class="flex items-center gap-2.5">
                                <span class="text-lg">📍</span>
                                <div>
                                    <p class="text-xs font-bold text-emerald-900">${stop.name || stop.stopName || 'Luas Stop'}</p>
                                    <p class="text-[10px] text-slate-400 font-semibold">Code: <code class="text-emerald-700 font-bold">${stop.id || stop.stop}</code></p>
                                </div>
                            </div>
                            <button onclick="quickSelect('${stop.id || stop.stop}')" class="text-xs bg-emerald-50 hover:bg-emerald-500 hover:text-white text-emerald-700 font-bold px-3 py-1.5 rounded-xl transition shadow-sm">
                                View Forecast ✨
                            </button>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            resultDiv.innerHTML = html;
        }
    </script>
